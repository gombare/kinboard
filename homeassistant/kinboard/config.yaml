name: Kinboard
version: "0.3.0"
slug: kinboard
description: Turn an old Kindle into a fridge dashboard with calendars, to-do lists and medications from Home Assistant.
url: https://github.com/gombare/kinboard/tree/main/homeassistant/kinboard
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
# Reads calendars, to-do lists and medications through the Supervisor proxy:
# no long-lived access token is needed.
homeassistant_api: true
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: Kinboard server for the Kindle (screensaver and panel)
watchdog: tcp://[HOST]:[PORT:8080]
map:
  - type: app_config
options:
  token: ""
  google_key: ""
  config: ""
schema:
  token: password
  google_key: password?
  config: str?
